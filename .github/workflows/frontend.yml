name: Frontend regression tests
on:
  push:
    paths:
      - 'ControladorGastos/wwwroot/**'
      - 'tests/frontend.test.cjs'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'ControladorGastos/wwwroot/**'
      - 'tests/frontend.test.cjs'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --check ControladorGastos/wwwroot/js/app.js
      - run: node --test tests/frontend.test.cjs
