name: Controle de Gastos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore ControladorGastos/ControladorGastos.csproj
      - name: Audit vulnerable NuGet packages
        shell: bash
        run: |
          dotnet list ControladorGastos/ControladorGastos.csproj package --vulnerable --include-transitive | tee "$RUNNER_TEMP/nuget-vulnerabilities.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/nuget-vulnerabilities.txt"; then
            echo "::error::NuGet vulnerability report contains vulnerable packages."
            exit 1
          fi
      - name: Build
        run: dotnet build ControladorGastos/ControladorGastos.csproj --configuration Release --no-restore
      - name: Smoke-test API validation
        shell: bash
        run: |
          export ConnectionStrings__DefaultConnection="Data Source=${RUNNER_TEMP}/controle-gastos-smoke.db"
          dotnet run --project ControladorGastos/ControladorGastos.csproj --configuration Release --no-build > "${RUNNER_TEMP}/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:5000/api/health >/dev/null
          curl --silent --show-error -D - -o /dev/null http://127.0.0.1:5000/api/pessoas |
            tr -d '\r' | grep -iq 'Cache-Control: no-store'
          person_response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"nome":"Ana","idade":30}' http://127.0.0.1:5000/api/pessoas)
          person_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$person_response")
          invalid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"descricao\":\"Valor fracionado\",\"valor\":12.345,\"tipo\":\"DESPESA\",\"pessoaId\":$person_id}" http://127.0.0.1:5000/api/transacoes)
          test "$invalid_status" = "400"
          valid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"descricao\":\"Valor válido\",\"valor\":12.34,\"tipo\":\"DESPESA\",\"pessoaId\":$person_id}" http://127.0.0.1:5000/api/transacoes)
          test "$valid_status" = "201"
          first_page=$(curl --silent --show-error --fail 'http://127.0.0.1:5000/api/transacoes?page=1&limit=1')
          python3 -c 'import json,sys; rows=json.load(sys.stdin); assert isinstance(rows,list) and len(rows)==1' <<< "$first_page"
          second_page=$(curl --silent --show-error --fail 'http://127.0.0.1:5000/api/transacoes?page=2&limit=1')
          python3 -c 'import json,sys; assert json.load(sys.stdin)==[]' <<< "$second_page"
          for invalid_query in 'page=0' 'page=100001' 'limit=0' 'limit=101'; do
            actual_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:5000/api/transacoes?$invalid_query")
            test "$actual_status" = "400"
          done
          minor_response=$(curl --silent --show-error --fail -H 'Content-Type: application/json' -d '{"nome":"Menor","idade":17}' http://127.0.0.1:5000/api/pessoas)
          minor_id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$minor_response")
          minor_income_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"descricao\":\"Receita de menor\",\"valor\":20.00,\"tipo\":\"RECEITA\",\"pessoaId\":$minor_id}" http://127.0.0.1:5000/api/transacoes)
          test "$minor_income_status" = "400"
          delete_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X DELETE "http://127.0.0.1:5000/api/pessoas/$person_id")
          test "$delete_status" = "204"
          remaining_transactions=$(curl --silent --show-error --fail http://127.0.0.1:5000/api/transacoes)
          python3 -c 'import json,sys; assert json.load(sys.stdin) == [], "Transações deveriam ser removidas junto com a pessoa"' <<< "$remaining_transactions"

      - name: Fail closed when required auth is missing
        shell: bash
        env:
          GASTOS_REQUIRE_AUTH: "true"
          GASTOS_READ_TOKEN: ""
          GASTOS_ADMIN_TOKEN: ""
        run: |
          set +e
          dotnet run --project ControladorGastos/ControladorGastos.csproj --configuration Release --no-build > "${RUNNER_TEMP}/required-auth-startup.log" 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -ne 0
          grep -q 'GASTOS_REQUIRE_AUTH=true' "${RUNNER_TEMP}/required-auth-startup.log"

      - name: Smoke-test protected API access
        shell: bash
        env:
          GASTOS_REQUIRE_AUTH: "true"
          GASTOS_READ_TOKEN: "ci-read-token-for-tests-only-0123456789abcdef"
          GASTOS_ADMIN_TOKEN: "ci-admin-token-for-tests-only-0123456789abcdef"
        run: |
          export ConnectionStrings__DefaultConnection="Data Source=${RUNNER_TEMP}/controle-gastos-auth.db"
          dotnet run --project ControladorGastos/ControladorGastos.csproj --configuration Release --no-build > "${RUNNER_TEMP}/api-auth.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/api/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5000/api/health)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5000/api/pessoas)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer incorrect-token' http://127.0.0.1:5000/api/pessoas)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GASTOS_READ_TOKEN" http://127.0.0.1:5000/api/pessoas)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GASTOS_READ_TOKEN" -H 'Content-Type: application/json' -d '{"nome":"Ana","idade":30}' http://127.0.0.1:5000/api/pessoas)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"nome":"Ana","idade":30}' http://127.0.0.1:5000/api/pessoas)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GASTOS_ADMIN_TOKEN" -H 'Content-Type: application/json' -d '{"nome":"Ana","idade":30}' http://127.0.0.1:5000/api/pessoas)" = "201"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $GASTOS_ADMIN_TOKEN" http://127.0.0.1:5000/api/pessoas)" = "200"
          duplicate_headers_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GASTOS_ADMIN_TOKEN" \
            -H "Authorization: Bearer $GASTOS_READ_TOKEN" http://127.0.0.1:5000/api/pessoas)
          test "$duplicate_headers_status" = "401"
          combined_headers_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GASTOS_ADMIN_TOKEN, Bearer $GASTOS_READ_TOKEN" http://127.0.0.1:5000/api/pessoas)
          test "$combined_headers_status" = "401"
          curl --silent --show-error -D - -o /dev/null \
            -H "Authorization: Bearer $GASTOS_READ_TOKEN" http://127.0.0.1:5000/api/transacoes |
            tr -d '\r' | grep -iq 'Cache-Control: no-store'
