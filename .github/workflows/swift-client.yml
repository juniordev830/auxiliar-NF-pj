name: Swift local API client
on:
  push:
    paths:
      - 'swift-client/**'
      - '.github/workflows/swift-client.yml'
  pull_request:
    paths:
      - 'swift-client/**'
      - '.github/workflows/swift-client.yml'
permissions:
  contents: read
jobs:
  swift-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.0'
      - name: Build and test Swift client
        run: swift test --package-path swift-client
